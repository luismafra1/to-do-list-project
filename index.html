  <body>
    <header class="header">
      <h1 class="header__title">To-Do List</h1>
    </header>

    <main class="main">
      <h2>Tasks</h2>
      <div id="tasks-container" role="list" aria-live="polite"></div>
      <div id="new-task-container">
        <label for="task-name">New task</label>
        <input id="task-name" type="text" />
        <label for="task-deadline">Deadline</label>
        <input id="task-deadline" type="date" />
        <label for="task-priority">Priority</label>
        <input id="task-priority" type="text" placeholder="e.g.: Medium" />
        <div id="new-task-btns-container">
          <button id="discard-task" type="button">Discard</button>
          <button id="save-task" type="button">Save Task</button>
        </div>
      </div>
      <dialog id="discard-modal">
        <p>Do you really want to discard the changes?</p>
        <div id="discard-confirmation-btn-container">
          <button id="yes" type="button">Yes</button>
          <button id="no" type="button">No</button>
        </div>
      </dialog>
      <div id="btns-container">
        <button id="add-task" type="button">Add Task</button>
        <button id="delete-task" type="button">Delete Task</button>
      </div>
    </main>
